<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Client Logos Carousel</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .logo-carousel {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .logo-carousel.loaded {
      opacity: 1;
    }

    .logo-track {
      display: flex;
      align-items: center;
      height: 100%;
      width: max-content;
      animation: scroll 30s linear infinite;
      animation-play-state: paused;
      will-change: transform;
    }

    .logo-carousel.loaded .logo-track {
      animation-play-state: running;
    }

    .logo-track img {
      height: 100%;
      width: auto;
      aspect-ratio: 1 / 1;    /* every source PNG is an 800x800 square canvas —
                                  this reserves the correct square slot instantly,
                                  without waiting for the file to actually load */
      margin: 0 2rem;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <div class="logo-carousel" id="carousel">
    <div class="logo-track" id="track">
      <img src="bontech.png" alt="bontech">
      <img src="cratis.png" alt="cratis">
      <img src="dcnorth.png" alt="dcnorth">
      <img src="hturist.png" alt="hturist">
      <img src="imperial-riviera.png" alt="imperial riviera">
      <img src="mup.png" alt="mup">
      <img src="KonicaMinolta.png" alt="Konica Minolta">
      <img src="PW.png" alt="PW">
      <img src="RB.png" alt="RB">
      <img src="Valamar.png" alt="Valamar">
      <img src="rbs.png" alt="rbs">
      <img src="suri.png" alt="suri">
      <img src="szfoi.png" alt="szfoi">
      <img src="tupperware.png" alt="tupperware">
      <img src="varazdin.png" alt="varazdin">
      <!-- Duplicate set for the seamless loop -->
      <img src="bontech.png" alt="bontech">
      <img src="cratis.png" alt="cratis">
      <img src="dcnorth.png" alt="dcnorth">
      <img src="hturist.png" alt="hturist">
      <img src="imperial-riviera.png" alt="imperial riviera">
      <img src="mup.png" alt="mup">
      <img src="KonicaMinolta.png" alt="Konica Minolta">
      <img src="PW.png" alt="PW">
      <img src="RB.png" alt="RB">
      <img src="Valamar.png" alt="Valamar">
      <img src="rbs.png" alt="rbs">
      <img src="suri.png" alt="suri">
      <img src="szfoi.png" alt="szfoi">
      <img src="tupperware.png" alt="tupperware">
      <img src="varazdin.png" alt="varazdin">
    </div>
  </div>

  <script>
    const carousel = document.getElementById('carousel');
    const track = document.getElementById('track');
    const imgs = Array.from(track.querySelectorAll('img'));

    Promise.all(imgs.map(img => {
      if (img.complete) return Promise.resolve();
      return new Promise(resolve => {
        img.addEventListener('load', resolve);
        img.addEventListener('error', resolve); // don't let one broken file block the rest
      });
    })).then(() => {
      // give layout one frame to settle before starting the loop
      requestAnimationFrame(() => carousel.classList.add('loaded'));
    });
  </script>
</body>
</html>
